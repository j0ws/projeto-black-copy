<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackCopy AI - Miner Module</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (CDN for prototype) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            500: '#ef4444', // Red for Youtube/TikTok vibe
                            600: '#dc2626',
                        },
                        dark: {
                            900: '#0F1115',
                            800: '#16191E',
                            700: '#20242B',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #0F1115; color: #E2E8F0; }
        .glass-panel {
            background: rgba(22, 25, 30, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        /* Dual Range Slider Styles */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            position: absolute;
            pointer-events: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            pointer-events: all;
            width: 16px;
            height: 16px;
            background-color: #ef4444;
            border-radius: 50%;
            cursor: pointer;
        }
        .slider-track {
            position: absolute;
            height: 4px;
            background: #ef4444;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 2px;
            z-index: -1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-panel border-b border-white/5 py-4">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="ph-fill ph-pickaxe text-brand-500 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-tight text-white">Black<span class="text-brand-500">Copy</span> Miner</h1>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-7xl mx-auto px-6 py-10 flex flex-col gap-8">
        
        <!-- Search Controls -->
        <section class="w-full max-w-4xl mx-auto space-y-4">
            <!-- Platform Toggle -->
            <div class="flex justify-center gap-4 mb-6">
                <label class="cursor-pointer flex items-center gap-2 bg-dark-800 border border-white/10 px-6 py-3 rounded-xl hover:border-brand-500 transition-colors">
                    <input type="radio" name="platform" value="youtube" checked class="text-brand-500 bg-dark-900 border-white/20 focus:ring-brand-500">
                    <i class="ph-fill ph-youtube-logo text-brand-500 text-xl"></i>
                    <span class="font-medium">YouTube</span>
                </label>
                <label class="cursor-pointer flex items-center gap-2 bg-dark-800 border border-white/10 px-6 py-3 rounded-xl hover:border-brand-500 transition-colors opacity-50" title="Mocked for V1">
                    <input type="radio" name="platform" value="tiktok" class="text-brand-500 bg-dark-900 border-white/20 focus:ring-brand-500">
                    <i class="ph-fill ph-tiktok-logo text-white text-xl"></i>
                    <span class="font-medium">TikTok (Mock)</span>
                </label>
            </div>

            <!-- Query Input -->
            <div class="relative bg-dark-800 rounded-2xl border border-white/10 overflow-hidden flex items-center p-2">
                <i class="ph-bold ph-magnifying-glass text-slate-400 text-xl ml-4"></i>
                <input type="text" id="searchInput" class="w-full bg-transparent text-white placeholder-slate-500 p-4 outline-none text-lg" placeholder="Enter keyword or product name (e.g. 'suco verde', 'creatina')">
                <button id="btnSearch" class="bg-brand-500 hover:bg-brand-600 text-white px-8 py-3 rounded-xl font-semibold transition-all">
                    Mine Clips
                </button>
            </div>

            <!-- Filters -->
            <div class="flex flex-wrap gap-4 items-center justify-center text-sm">
                <select id="filterTime" class="bg-dark-800 border border-white/10 text-slate-300 rounded-lg px-4 py-2 outline-none focus:border-brand-500">
                    <option value="">Any Time</option>
                    <option value="24h">Last 24 Hours</option>
                    <option value="30d">Last 30 Days</option>
                </select>
                <input type="text" id="filterChannel" placeholder="Specific Channel" class="bg-dark-800 border border-white/10 text-slate-300 rounded-lg px-4 py-2 outline-none focus:border-brand-500 w-48">
            </div>

            <div id="statusAlert" class="hidden text-center text-brand-500 font-medium"></div>
        </section>

        <!-- Results Grid -->
        <section id="resultsSection" class="hidden">
            <div class="flex justify-between items-center border-b border-white/10 pb-4 mb-6">
                <h3 class="text-2xl font-bold text-white">Found Clips</h3>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" id="cardsContainer">
                <!-- Cards injected here -->
            </div>
        </section>

    </main>

    <!-- Global Floating Action Button -->
    <div class="fixed bottom-8 right-8 z-50">
        <button id="btnDownloadSelected" disabled class="bg-dark-800 border border-white/10 text-slate-400 px-6 py-4 rounded-2xl font-bold shadow-2xl flex items-center gap-3 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
            <i class="ph-bold ph-download-simple text-2xl"></i>
            <span>Download Selected (<span id="selectedCount">0</span>)</span>
        </button>
    </div>

    <script>
        const API_BASE_URL = "http://127.0.0.1:8000/api/v1/miner";
        let selectedVideos = [];
        let videoDataMap = {}; // Maps videoId to {url, start, end}

        document.getElementById('btnSearch').addEventListener('click', async () => {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return alert("Enter a keyword to search.");

            const platform = document.querySelector('input[name="platform"]:checked').value;
            const filterTime = document.getElementById('filterTime').value;
            const channel = document.getElementById('filterChannel').value.trim();

            const btn = document.getElementById('btnSearch');
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i>';
            btn.disabled = true;
            document.getElementById('resultsSection').classList.add('hidden');
            document.getElementById('statusAlert').classList.add('hidden');
            document.getElementById('cardsContainer').innerHTML = '';
            
            try {
                const reqBody = {
                    query: query,
                    platform: platform,
                    max_results: 12,
                    filter_time: filterTime || null,
                    channel_name: channel || null
                };

                const res = await fetch(`${API_BASE_URL}/search`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(reqBody)
                });
                
                if (!res.ok) throw new Error("Backend search failed");
                const data = await res.json();
                
                if(data.data.length === 0) {
                    document.getElementById('statusAlert').innerText = "No results found.";
                    document.getElementById('statusAlert').classList.remove('hidden');
                    return;
                }

                renderCards(data.data, platform, query);
                document.getElementById('resultsSection').classList.remove('hidden');

            } catch (err) {
                console.error(err);
                document.getElementById('statusAlert').innerText = `Error: ${err.message}. Is backend running?`;
                document.getElementById('statusAlert').classList.remove('hidden');
            } finally {
                btn.innerHTML = 'Mine Clips';
                btn.disabled = false;
            }
        });

        async function renderCards(videos, platform, queryWord) {
            const container = document.getElementById('cardsContainer');

            for (let vid of videos) {
                if(!vid.id) continue;
                
                // Fetch Highlights (Mocked T-0.5 logic here for UI speed, but calls backend to get accurate transcript match)
                let keywordStart = 0;
                let keywordEnd = 10;
                
                if (platform === 'youtube') {
                    try {
                        const hRes = await fetch(`${API_BASE_URL}/highlights?video_url=${encodeURIComponent(vid.url)}&query_word=${encodeURIComponent(queryWord)}`);
                        if (hRes.ok) {
                            const hData = await hRes.json();
                            if(hData.highlights && hData.highlights.length > 0) {
                                keywordStart = Math.max(0, hData.highlights[0].start_time - 0.5);
                                keywordEnd = Math.min(vid.duration || 60, keywordStart + 10);
                            }
                        }
                    } catch(e) { console.warn("Transcript failed, defaulting to 0s", e); }
                }

                videoDataMap[vid.id] = {
                    url: vid.url,
                    duration: vid.duration || 60,
                    start: keywordStart,
                    end: Math.min(keywordStart + 10, vid.duration || 60)
                };

                const cardHtml = `
                <div class="glass-panel rounded-2xl overflow-hidden border border-white/5 relative">
                    <!-- Checkbox -->
                    <div class="absolute top-3 left-3 z-10">
                        <input type="checkbox" onchange="toggleSelection('${vid.id}', this.checked)" class="w-6 h-6 rounded border-white/20 bg-dark-900 text-brand-500 focus:ring-brand-500 cursor-pointer">
                    </div>

                    <!-- Video Preview Area -->
                    <div class="aspect-video bg-dark-900 relative group overflow-hidden"
                         onmouseenter="playPreview('${vid.id}', '${platform}', ${keywordStart})"
                         onmouseleave="stopPreview('${vid.id}')">

                        <!-- Thumbnail (Fallback to simple image if yt-dlp didnt provide thumbnail) -->
                        <img id="thumb-${vid.id}" src="https://i.ytimg.com/vi/${vid.id}/hqdefault.jpg" class="w-full h-full object-cover transition-opacity duration-300" onerror="this.src='https://placehold.co/600x400/16191E/333333?text=No+Thumbnail'">

                        <!-- Hover Overlay Text -->
                        <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-10">
                            <span class="bg-black/80 px-3 py-1 rounded text-xs font-medium">10s Preview...</span>
                        </div>

                        <!-- Iframe Container -->
                        <div id="player-${vid.id}" class="absolute inset-0 hidden"></div>
                    </div>

                    <div class="p-4 space-y-4">
                        <h4 class="text-sm font-semibold text-white line-clamp-2" title="${vid.title}">${vid.title}</h4>
                        <div class="flex justify-between text-xs text-slate-400">
                            <span><i class="ph-fill ph-eye"></i> ${vid.view_count.toLocaleString()}</span>
                            <span>@${vid.channel}</span>
                        </div>

                        <!-- Slicing Controller -->
                        <div class="pt-3 border-t border-white/10">
                            <div class="flex justify-between text-xs mb-2">
                                <span class="text-brand-500 font-medium">Start: <span id="start-label-${vid.id}">${formatTime(keywordStart)}</span></span>
                                <span class="text-brand-500 font-medium">End: <span id="end-label-${vid.id}">${formatTime(keywordEnd)}</span></span>
                            </div>

                            <div class="relative h-6 w-full mt-2">
                                <div class="slider-track absolute left-0 right-0"></div>
                                <!-- Dual Sliders -->
                                <input type="range" id="slider-start-${vid.id}" min="0" max="${vid.duration}" value="${keywordStart}" step="1" oninput="updateSlider('${vid.id}', 'start')">
                                <input type="range" id="slider-end-${vid.id}" min="0" max="${vid.duration}" value="${keywordEnd}" step="1" oninput="updateSlider('${vid.id}', 'end')">
                            </div>
                            <div class="text-center mt-2">
                                <span class="text-[10px] text-slate-500">Max slice limit: 20s. Stream Chunking.</span>
                            </div>
                        </div>
                    </div>
                </div>`;
                container.insertAdjacentHTML('beforeend', cardHtml);

                // Initialize visual track
                updateTrackVisuals(vid.id);
            }
        }

        // --- Dual Slider Logic enforcing 20s max limit ---
        function updateSlider(vidId, type) {
            const startSlider = document.getElementById(`slider-start-${vidId}`);
            const endSlider = document.getElementById(`slider-end-${vidId}`);
            let startVal = parseFloat(startSlider.value);
            let endVal = parseFloat(endSlider.value);

            // Prevent crossing
            if (startVal >= endVal) {
                if (type === 'start') startSlider.value = endVal - 1;
                else endSlider.value = startVal + 1;
                startVal = parseFloat(startSlider.value);
                endVal = parseFloat(endSlider.value);
            }

            // Enforce max 20s
            const MAX_RANGE = 20;
            let isMaxed = false;

            if (endVal - startVal >= MAX_RANGE) {
                isMaxed = true;
                if (endVal - startVal > MAX_RANGE) {
                    if (type === 'start') {
                        startSlider.value = endVal - MAX_RANGE;
                    } else {
                        endSlider.value = startVal + MAX_RANGE;
                    }
                }
            }

            // Update Labels & Memory
            document.getElementById(`start-label-${vidId}`).innerText = formatTime(startSlider.value);
            document.getElementById(`end-label-${vidId}`).innerText = formatTime(endSlider.value);
            videoDataMap[vidId].start = parseFloat(startSlider.value);
            videoDataMap[vidId].end = parseFloat(endSlider.value);

            updateTrackVisuals(vidId, isMaxed);
        }

        function updateTrackVisuals(vidId, isMaxed = false) {
            const startSlider = document.getElementById(`slider-start-${vidId}`);
            const endSlider = document.getElementById(`slider-end-${vidId}`);
            const track = startSlider.previousElementSibling;

            // Safe fallback if duration wasn't mapped correctly by yt-dlp
            const max = parseFloat(startSlider.max) || 60;
            const startPct = (parseFloat(startSlider.value) / max) * 100;
            const endPct = (parseFloat(endSlider.value) / max) * 100;

            track.style.left = `${startPct}%`;
            track.style.width = `${endPct - startPct}%`;

            // Visual feedback when hitting the hard constraint
            if(isMaxed) {
                track.style.backgroundColor = '#facc15'; // yellow-400 warning
            } else {
                track.style.backgroundColor = '#ef4444'; // brand-500 default
            }
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        // --- Hover Preview Logic (Embeds YT Iframe dynamically to save DOM size) ---
        let activePlayerTimeouts = {};
        let hoverDebounceTimers = {};

        function playPreview(vidId, platform, startTime) {
            if (platform !== 'youtube') return;

            // Clear any existing stop timeout if we re-enter quickly
            clearTimeout(activePlayerTimeouts[vidId]);

            // Debounce the iframe injection by 400ms to prevent mass loading when mouse sweeps across screen
            hoverDebounceTimers[vidId] = setTimeout(() => {
                const playerDiv = document.getElementById(`player-${vidId}`);
                const thumb = document.getElementById(`thumb-${vidId}`);

                // Only inject if it's not already playing
                if (playerDiv.innerHTML === '') {
                    playerDiv.innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${vidId}?autoplay=1&mute=1&start=${Math.floor(startTime)}&controls=0&modestbranding=1" frameborder="0" allow="autoplay; encrypted-media"></iframe>`;
                    playerDiv.classList.remove('hidden');
                    thumb.classList.add('opacity-0');
                }

                // Force stop after 10s of playing
                activePlayerTimeouts[vidId] = setTimeout(() => {
                    stopPreview(vidId);
                }, 10000);
            }, 400); // 400ms debounce
        }

        function stopPreview(vidId) {
            // Cancel any pending load if mouse leaves before debounce fires
            clearTimeout(hoverDebounceTimers[vidId]);
            clearTimeout(activePlayerTimeouts[vidId]);

            const playerDiv = document.getElementById(`player-${vidId}`);
            const thumb = document.getElementById(`thumb-${vidId}`);

            // Destroy iframe completely to free memory and kill audio/video
            playerDiv.innerHTML = '';
            playerDiv.classList.add('hidden');
            thumb.classList.remove('opacity-0');
        }

        // --- Download Selection Logic ---
        function toggleSelection(vidId, isChecked) {
            if (isChecked) {
                if (!selectedVideos.includes(vidId)) selectedVideos.push(vidId);
            } else {
                selectedVideos = selectedVideos.filter(id => id !== vidId);
            }

            const btn = document.getElementById('btnDownloadSelected');
            const countSpan = document.getElementById('selectedCount');
            countSpan.innerText = selectedVideos.length;

            if (selectedVideos.length > 0) {
                btn.disabled = false;
                btn.classList.remove('bg-dark-800', 'text-slate-400');
                btn.classList.add('bg-brand-600', 'text-white', 'hover:bg-brand-500', 'shadow-brand-500/50');
            } else {
                btn.disabled = true;
                btn.classList.add('bg-dark-800', 'text-slate-400');
                btn.classList.remove('bg-brand-600', 'text-white', 'hover:bg-brand-500', 'shadow-brand-500/50');
            }
        }

        document.getElementById('btnDownloadSelected').addEventListener('click', async () => {
            const btn = document.getElementById('btnDownloadSelected');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-2xl"></i> Slicing streams...';
            btn.disabled = true;

            const payload = {
                clips: selectedVideos.map(vidId => ({
                    video_url: videoDataMap[vidId].url,
                    start_time: videoDataMap[vidId].start,
                    end_time: videoDataMap[vidId].end
                }))
            };

            try {
                const res = await fetch(`${API_BASE_URL}/download-clips`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                if(res.ok) {
                    alert(`Success: ${data.message}`);
                } else {
                    alert(`Backend Error: ${data.detail}`);
                }
            } catch (err) {
                alert(`Network Error: ${err.message}`);
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
